<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HNx" />
    <meta
      name="description"
      content="A private, first-party Hacker News reader. No accounts, no trackers, no third-party scripts."
    />
    <title>HNx</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=4" />
    <link rel="preload" href="/fonts/Geist-1.9.2-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/GeistMono-1.9.2-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script src="/theme-init.js?v=36"></script>
    <link rel="stylesheet" href="/styles.css?v=37" />
    <link rel="modulepreload" href="/app.js?v=37" />
    <script src="/prefetch.js?v=37" type="module"></script>
    <script src="/app.js?v=37" type="module"></script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/plain" />
      <div class="noscript-fallback">
        <div class="noscript-card">
          <h1>HNx</h1>
          <p>
            JavaScript is disabled. HNx includes a full plain-HTML reader that works
            without scripts.
          </p>
          <p>
            <a class="btn" href="/plain">Continue to plain HTML reader</a>
          </p>
          <p class="noscript-meta">
            <a href="/privacy.html">Privacy</a>
          </p>
        </div>
      </div>
    </noscript>
    <p class="offline-banner status" data-offline-banner role="status" hidden>Offline. Showing saved and recently loaded stories</p>
    <main id="app" class="app" aria-live="polite"></main>
    <footer class="site-footer"><a href="/privacy.html">Privacy</a></footer>
    <dialog class="reader-sheet" aria-labelledby="reader-title" data-reader>
      <header class="reader-header">
        <h1 id="reader-title" data-reader-title></h1>
        <div class="reader-actions">
          <button class="btn" type="button" aria-label="Save for later" aria-pressed="false" data-reader-save>Save</button>
          <button class="btn" type="button" data-reader-close autofocus>Close</button>
        </div>
      </header>
      <div class="reader-content" data-reader-content></div>
    </dialog>
    <div class="save-toast" data-save-toast>
      <span role="status" aria-live="polite"></span>
      <button class="btn" type="button" data-save-undo hidden>Undo</button>
    </div>
  </body>
</html>
